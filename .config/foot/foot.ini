################################################################################
## Foot Config - Thorn (Dark Forest) Theme                                    ##
################################################################################

[main]
pad=0x0
# font=Jetbrains Mono:weight=medium:size=10.1
font=SF Mono:weight=medium:size=10.5
# line-height-adjustment=2pt
resize-delay-ms=250
dpi-aware=yes
term=foot
title=Thorn

[scrollback]
lines=5000
multiplier=1
indicator-format=percentage
indicator-position=fixed

[url]
osc8-underline=url-mode
launch=xdg-open ${url}

[cursor]
style=block
blink=no
beam-thickness=1
# Cursor color: <text-color> <cursor-background>
# Uses background color for text, and your teal 'type_fg' for the block
# col uor=0d1a1b 88b497

[mouse]
hide-when-typing=no

[colors]
alpha=1.0
foreground=dbd2c7
background=0d1a1b
cursor=0d1a1b 88b497

#### Selection colors
selection-foreground=dbd2c7
selection-background=1b3030

#### Normal/regular colors (color palette 1–8)
regular0=142122  # black (mapped to cursorline tint)
regular1=e07070  # red (mapped to operator)
regular2=c0dda0  # green (mapped to string_fg)
regular3=f5a97a  # yellow (mapped to keyword warm orange)
regular4=9dcee8  # blue (mapped to function)
regular5=b388b5  # magenta (muted purple to fit aesthetic)
regular6=88b497  # cyan (mapped to type_fg teal)
regular7=dbd2c7  # white (mapped to palette.fg)

#### Bright colors (color palette 9–16)
bright0=568270   # bright black (mapped to comment for muted visibility)
bright1=e07070   # bright red
bright2=c0dda0   # bright green
bright3=f5a97a   # bright yellow
bright4=9dcee8   # bright blue
bright5=b388b5   # bright magenta
bright6=88b497   # bright cyan
bright7=ffffff   # bright white (pure white for stark contrast when needed)

[key-bindings]
# Terminal copy/paste mapped to Ctrl+C and Ctrl+V
clipboard-copy=Control+c XF86Copy
clipboard-paste=Control+v XF86Paste

[text-bindings]
\x03 = Control+x 

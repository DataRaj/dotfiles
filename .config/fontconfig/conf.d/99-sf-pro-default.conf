<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
    <!-- Map standard sans-serif requests to SF Pro Display -->
    <match target="pattern">
        <test qual="any" name="family"><string>sans-serif</string></test>
        <edit name="family" mode="assign" binding="same"><string>SF Pro Display</string></edit>
    </match>
    <match target="pattern">
        <test qual="any" name="family"><string>sans</string></test>
        <edit name="family" mode="assign" binding="same"><string>SF Pro Display</string></edit>
    </match>

    <!-- Map terminal and code monospace requests strictly to SF Mono -->
    <match target="pattern">
        <test qual="any" name="family"><string>monospace</string></test>
        <edit name="family" mode="assign" binding="same"><string>SF Mono</string></edit>
    </match>
</fontconfig>

<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
    <!-- Block Google Noto Fonts -->
    <selectfont>
        <rejectfont>
            <pattern>
                <patelt name="family"><string>Noto Sans</string></patelt>
            </pattern>
            <pattern>
                <patelt name="family"><string>Noto Serif</string></patelt>
            </pattern>
            <pattern>
                <patelt name="family"><string>Noto Sans VF</string></patelt>
            </pattern>
            <pattern>
                <patelt name="family"><string>Roboto</string></patelt>
            </pattern>
        </rejectfont>
    </selectfont>
</fontconfig>

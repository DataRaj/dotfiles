keep-open=yes
ao=pipewire

vo=gpu-next
gpu-api=vulkan
hwdec=auto-safe

# Define a profile you can trigger on any video
[hdr-boost]
profile-desc="HDR Highlight and Contrast Boost"
tone-mapping=bt.2446a
target-peak=250
gamma=5
saturation=10


# Press Shift + H to apply the boost profile
H apply-profile hdr-boost

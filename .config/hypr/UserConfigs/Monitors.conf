# Monitor Configuration
# See Hyprland wiki for more details
# https://wiki.hyprland.org/Configuring/Monitors/
# Configure your Display resolution, offset, scale and Monitors here, use `hyprctl monitors` to get the info.



# High Refresh Rate
# monitor=,highrr,auto,1

# The 24-inch Acer Nitro (Primary, 165Hz, positioned at 0,0)
# Syntax: monitor=name,resolution@refresh,position,scale
#monitor = HDMI-A-1, 1920x1080@100, 0x0, 1
# monitor = HDMI-A-1,2560x1440@100, 0x0, 1

# High Resolution
# monitor=,highres,auto,1.2a

# Monitors
# monitor=eDP-1,preferred,auto,1

# # The 24-inch Acer Nitro (Primary, 165Hz)
# # (Change 1920x1080 to 2560x1440 if your monitor is 2K)
# monitor = HDMI-A-1, 1920x1080@100, 0x0, 1
#
# # Completely disable the Dell laptop screen
# monitor = eDP-1, disable

# The 24-inch Acer Nitro (Primary)
# monitor = HDMI-A-1, 1920x1080@165, 0x0, 1
#
# # The Dell laptop screen (Tells it to mirror the HDMI port)
# monitor = eDP-1, 1920x1080@60, 0x0, 1, mirror, HDMI-A-1

# NOTE: for laptop, kindly check notes in Laptops.conf regarding display
# Created this inorder for the monitor display to not wake up if not intended.
# See here: https://github.com/hyprwm/Hyprland/issues/4090

# Some examples to set your own monitor
#monitor = eDP-1, preferred, auto, 1
#monitor = eDP-1, 2560x1440@165, 0x0, 1 #own screen
#monitor = DP-3, 1920x1080@240, auto, 1 
#monitor = DP-1, preferred, auto, 1
#monitor = HDMI-A-1, preferred,auto,1

# QEMU-KVM, virtual box or vmware
#monitor = Virtual-1, 1920x1080@60,auto,1

# to disable a monitor
#monitor=name,disable

# Mirror samples
#monitor=DP-3,1920x1080@60,0x0,1,mirror,DP-2
#monitor=,preferred,auto,1,mirror,eDP-1
#monitor=HDMI-A-1,2560x1440@144,0x0,1,mirror,eDP-1

# 10 bit monitor support - See wiki https://wiki.hyprland.org/Configuring/Monitors/#10-bit-support - See NOTES below
# NOTE: Colors registered in Hyprland (e.g. the border color) do not support 10 bit.
# NOTE: Some applications do not support screen capture with 10 bit enabled. (Screen captures like OBS may render black screen)
# monitor=,preferred,auto,1,bitdepth,10

#monitor=eDP-1,transform,0
#monitor=eDP-1,addreserved,10,10,10,49

# workspaces - Monitor rules
# https://wiki.hyprland.org/Configuring/Workspace-Rules/
# SUPER E - Workspace-Rules 
# See ~/.config/hypr/UserConfigs/WorkspaceRules.conf
# 1. Position the monitors side-by-side
monitor = HDMI-A-1, 1920x1080@165, 0x0, 1
# monitor = HDMI-A-1, 2400×1350@100, 0x0, 1.
monitor = eDP-1, 1920x1080@75, 1920x0, 1
# Syntax: monitor = [PORT], [RESOLUTION@HZ], [POSITION], [SCALE], bitdepth, 10, cm, hdr, sdrbrightness, [VALUE]
# 2. Force workspaces to stay on the Acer monitor!
# This stops Hyprland from randomly throwing apps onto the laptop screen.
# monitor = DP-1, 1920x1080@120, 0x0, 1, bitdepth, 10, cm, hdr, sdrbrightness, 1
workspace = 1, monitor:HDMI-A-1, default:true
workspace = 2, monitor:HDMI-A-1
workspace = 3, monitor:HDMI-A-1
workspace = 4, monitor:HDMI-A-1
workspace = 5, monitor:HDMI-A-1
workspace = 6, monitor:HDMI-A-3

# ==========================
# 0. PERFORMANCE (CRITICAL)
# ==========================
# Zero-lag Escape key for Vim/NvChad
set -s escape-time 0

# Increase scrollback history (memory is cheap, context is expensive)
set -g history-limit 50000

# Increase message display time (so you can read status messages)
set -g display-time 4000

# ==========================
# 1. CORE SETTINGS & PREFIX
# ==========================
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -g status-position top
setw -g mode-keys vi

# ==========================
# 2. KEYBINDINGS
# ==========================
# Reload configuration
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# Window splitting
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind b split-window -v -c "#{pane_current_path}"

# New window preserving current path
bind c new-window -c "#{pane_current_path}"

# Pane navigation (vim-style and arrows)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -n M-Left select-pane -L
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U
bind -n M-Right select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vi copy mode keybindings
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# ==========================
# 3. PLUGINS
# ==========================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator' # Ctrl+h/j/k/l navigation
set -g @plugin 'tmux-plugins/tmux-resurrect'     # Save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'     # Auto restore

# ==========================================
# 4. THORN THEME (Matching Neovim Thorn Palette)
# ==========================================
# Palette:
#   bg:            #0D1A1B (Deep forest black-green)
#   bg_surface:    #142122 (Lighter surface / inactive tab)
#   bg_visual:     #1B3030 (Selected tab / active pill)
#   fg:            #dff7ef (Bright mint white)
#   fg_muted:      #568270 (Muted comment green)
#   accent_teal:   #88B497 (Thorn primary mint teal)
#   accent_orange: #F5A97A (Warm peach/orange)
#   accent_blue:   #9DCEE8 (Soft icy blue)

set -g status "on"
set -g status-justify "left"
set -g status-position "top"
set -g status-style "bg=#0D1A1B,fg=#dff7ef"

# Status left: Session name in styled pill
set -g status-left-length 100
set -g status-left "#[fg=#0D1A1B,bg=#88B497,bold]  #S #[fg=#88B497,bg=#0D1A1B,nobold] "

# Status right: Directory path, Time, Date
set -g status-right-length 150
set -g status-right "#[fg=#1B3030,bg=#0D1A1B]#[fg=#88B497,bg=#1B3030]  #{b:pane_current_path} #[fg=#568270,bg=#1B3030]| #[fg=#9DCEE8,bg=#1B3030] %H:%M #[fg=#1B3030,bg=#0D1A1B] #[fg=#F5A97A,bg=#0D1A1B]#[fg=#0D1A1B,bg=#F5A97A,bold]󰃭 %d-%b #[fg=#F5A97A,bg=#0D1A1B]"

# Window tabs
setw -g window-status-separator " "

# Inactive window tab
setw -g window-status-format "#[fg=#142122,bg=#0D1A1B]#[fg=#568270,bg=#142122]#I #[fg=#568270,bg=#142122]| #[fg=#88B497,bg=#142122]#W#[fg=#142122,bg=#0D1A1B]"

# Active window tab
setw -g window-status-current-format "#[fg=#1B3030,bg=#0D1A1B]#[fg=#F5A97A,bg=#1B3030,bold]#I #[fg=#568270,bg=#1B3030]| #[fg=#dff7ef,bg=#1B3030,bold]#W#[fg=#1B3030,bg=#0D1A1B]"

# Pane borders
set -g pane-border-style "fg=#1B3030,bg=default"
set -g pane-active-border-style "fg=#88B497,bg=default"

# Message popup & command prompt
set -g message-style "bg=#1B3030,fg=#dff7ef,bold"
set -g message-command-style "bg=#1B3030,fg=#88B497"

# Mode / Selection style
setw -g mode-style "bg=#1B3030,fg=#dff7ef"

# ==========================================
# 5. WINDOW NAVIGATION (Browser/IDE Style)
# ==========================================

# 1. Ctrl+Tab / Ctrl+Shift+Tab to cycle windows
# Note: This requires a terminal that sends these specific keycodes.
bind -n C-~ next-window
bind -n C-S-Tab previous-window

# 2. Alt + Number to jump to window (0-9)
# The "-n" flag means "no prefix" - just press Alt+1 instantly.
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Set default terminal mode to 256 colors
set -g default-terminal "tmux-256color"

# Enable True Color (24-bit) support for Foot and standard xterm
set-option -sa terminal-overrides ",foot*:Tc"
set-option -sa terminal-overrides ",xterm*:Tc"

# 2. Resurrect & Continuum Configuration
set -g @resurrect-dir '~/.tmux/resurrect'
set -g @resurrect-strategy-nvim 'session'  # Restores Neovim sessions if using Session.vim
set -g @resurrect-capture-pane-contents 'on' # Restores terminal pane text

# 3. Enable Auto-Save & Auto-Restore on System Boot
set -g @continuum-restore 'on'             # Auto-restores last environment when tmux starts
set -g @continuum-boot 'on'                # Auto-starts tmux server via systemd on Linux boot

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

